/* CYP FIN: the layout of the app around the classes of the CYP design system (ds/bundle.css).
   Colours, fonts, spacing and radii come from ds/tokens.css only. 720px and 1200px are the content widths apps.md gives for computers. */

body{background:var(--surface-soft);-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}

main.fin-home{padding-bottom:var(--space-6)}
.cyp-chitenge{flex:none}

@media (min-width:900px){nav.cyp-tabbar{display:none}.cyp-nav{display:flex}main.cyp-has-tabbar{padding-bottom:var(--space-6)}}
/* text helpers */
.b{font-weight:bold} .s{font:var(--type-small) var(--font-text)} .s.b{font-weight:bold} .m{color:var(--ink-muted)} .num{font-variant-numeric:tabular-nums} .row>.num{white-space:nowrap}
.big{font:var(--type-heading-2) var(--font-display)}

.wrap{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)}
.list{display:flex;flex-direction:column;gap:var(--space-2)}
.btns{display:flex;gap:var(--space-2)} .btns>*{flex:1 1 0}
.two{display:flex;gap:var(--space-2)} .two>*{flex:1 1 0;min-width:0} .two .cyp-input{min-width:0;padding:0 var(--space-2)}
.rows{display:flex;flex-direction:column;gap:var(--space-1);margin:var(--space-1) 0} .rows .row>div:first-child{min-width:0}
.cyp-btn{text-align:center}
.cyp-btn.user{justify-content:flex-start;text-align:left;width:100%;padding:var(--space-2) var(--space-4)}

.cyp-table.plan .cyp-btn{padding:0 var(--space-2);white-space:normal}

.cyp-table .cyp-btn{min-height:var(--touch-min);padding:0 var(--space-3);text-align:left;justify-content:flex-start}
.prow,.mrow{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);border-top:1px solid var(--line);padding:var(--space-2) 0}

@media (min-width:900px){.pickbar{bottom:0}}

.picking main,.picking .sheet,.picking .cyp-appbar{cursor:crosshair}

/* beta 1.0, third step */
.cyp-card.tap>.btns,.cyp-card>.btns{margin-top:var(--space-1)}
.cyp-stat__figure.fin-k{font:var(--type-heading-1) var(--font-display)}

.cyp-row.user .cyp-btn{flex:none}
.center-row{align-items:center}
.cyp-table.fin-reqs thead th,.cyp-table.fin-reqs tbody td{text-align:left;vertical-align:middle}
.cyp-table.fin-reqs thead th.num,.cyp-table.fin-reqs tbody td.num{text-align:right;white-space:nowrap}
.cyp-doc .cyp-table thead th:first-child,.cyp-doc .cyp-table tbody td:first-child,.cyp-doc .cyp-table tfoot td:first-child{text-align:left}
.cyp-row__text .cyp-tag{margin-bottom:var(--space-1)}
.cyp-table.fin-reqs td:last-child{width:1%}
.cyp-sheet__foot .btns{margin:0}
/* the report: cover on the blue ground, chapters row, one chapter at a time */
.fin-cover{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-3);padding:var(--space-12) var(--space-6);border-radius:var(--radius-control)}
.fin-cover__title{margin:0;font:var(--type-opener-title) var(--font-display);text-transform:uppercase;color:var(--on-dark)}
.fin-cover__period{margin:0 0 var(--space-4);font:var(--type-heading-2) var(--font-display);color:var(--yellow)}
.cyp-nav.fin-chapters{display:flex;position:static;border-radius:var(--radius-control)}

.fin-repnav{align-items:center;margin-top:var(--space-2)}
.fin-repnav .cyp-btn--primary{margin-left:auto}
/* one request on paper: only the form prints */
#print{display:none}

<body>
<div id="app"></div>
<div id="print"></div>
<script src="ds/icons.js"></script>
<script src="budget.js"></script>
<script src="core.js"></script>
<script>
'use strict';
var FIN_VERSION = 'beta 1.10';

/* ================= small tools ================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function uid() { var a = new Uint8Array(12); (window.crypto || window.msCrypto).getRandomValues(a); var s = ''; for (var i = 0; i < a.length; i++) s += ('0' + a[i].toString(16)).slice(-2); return s; }
function nowIso() { return new Date().toISOString(); }
function today() { return finToday(nowIso()); }
function money(n) { return 'K ' + (Math.round(Number(n) * 100) / 100).toLocaleString('en-US'); }
function pct(n, d) { return d > 0 ? Math.round(n / d * 100) : 0; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], MOL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function day(s) { if (!finIsDate(s)) return ''; return WD[finWeekday(s)] + ' ' + Number(s.slice(8, 10)) + ' ' + MO[Number(s.slice(5, 7)) - 1] + (s.slice(0, 4) !== today().slice(0, 4) ? ' ' + s.slice(0, 4) : ''); }
function when(iso) { return iso ? day(finToday(iso)) : ''; }
/* SHA-256 of a plain text (letters and digits only), as hex */
function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  var mp = Math.pow, maxWord = mp(2, 32), i, j, result = '', words = [], bits = ascii.length * 8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], pc = k.length, comp = {};
  for (var c = 2; pc < 64; c++) { if (!comp[c]) { for (i = 0; i < 313; i += c) comp[i] = c; hash[pc] = (mp(c, .5) * maxWord) | 0; k[pc++] = (mp(c, 1 / 3) * maxWord) | 0; } }
  ascii += '\x80'; while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); if (j >> 8) return ''; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((bits / maxWord) | 0); words[words.length] = bits;
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? '0' : '') + b.toString(16); }
  return result;
}
function credOf(salt, pin) { return sha256(salt + ':' + pin); }
var ICMAP = { decide: 'check', down: 'download', lock: 'lock', mine: 'file-text', month: 'bar-chart-3', people: 'users', rules: 'settings', soon: 'calendar' };
var PLACE = { LUI: 'luigi', MIN: 'minsundu', NKW: 'nkwazi', CSC: 'community-school', HFH: 'holy-family', MCP: 'mary-christine' };
var SECICON = { FAM: 'home', SCH: 'school', UCC: 'puzzle', TEN: 'trophy', FOO: 'trophy', BAS: 'trophy', GOL: 'trophy', MEC: 'wrench', COM: 'wrench', CAR: 'wrench', AGR: 'wrench', CAN: 'utensils', GIG: 'sprout', FRM: 'sprout', ELE: 'sprout', CPP: 'sprout', ADM: 'briefcase', HRS: 'contact', SEC: 'shield', TRA: 'bus', MEW: 'cog', MNT: 'hammer' };
function secDisc(c) { var pl = PLACE[c], icn = pl ? 'map-pin' : SECICON[c]; return icn ? '<span class="cyp-disc cyp-disc--sm ' + (pl ? 'cyp-c-' + pl : 'cyp-c-blue') + '">' + di(icn).replace(' class="cyp-icon"', '') + '</span>' : ''; }
function di(n) { return '<svg class="cyp-icon" viewBox="0 0 24 24" aria-hidden="true">' + ((window.CYP_ICONS || {})[n] || '') + '</svg>'; }
function ic(n) { return ICMAP[n] ? di(ICMAP[n]) : ''; }
/* the logo of the Cicetekelo Youth Project, the same picture CYP EDU shows */

/* ================= budget ================= */
/* names fixed by the design system: Luigi and Minsundu without the word Centre. Only what is shown changes; budget.js and the database keep their values */
var SHOWN = { 'Luigi Centre': 'Luigi', 'Minsundu Centre': 'Minsundu' };
FIN_BUDGET.sections.forEach(function (s) { if (SHOWN[s.name]) s.name = SHOWN[s.name]; });
var SEC = {}, LINE = {};
FIN_BUDGET.sections.forEach(function (s) {
  var tot = 0;
  s.lines = s.lines.map(function (l) { var o = { id: l[0], name: l[1], qty: l[2], unit: l[3], freq: l[4], total: l[5], act: l[6] || '', sec: s.code }; LINE[o.id] = o; tot += o.total; return o; });
  s.total = tot; SEC[s.code] = s;
});
/* departments that ask without a section of the budget of their own (Transport, Maintenance ...), and the two parts of the project */
var DEPT = {}; FIN_DEPTS.forEach(function (d) { DEPT[d[0]] = { code: d[0], name: d[1], part: d[2] }; });
var DEPT_CODES = FIN_BUDGET.sections.map(function (s) { return s.code; }).concat(FIN_DEPTS.map(function (d) { return d[0]; }));
function secName(code) { return SEC[code] ? SEC[code].name : DEPT[code] ? DEPT[code].name : code; }
function partText(code) { return finPart(code) === 'C' ? 'Commercial' : 'Social'; }
function secOf(r, line) { return LINE[line] ? LINE[line].sec : r.section; }
function reviewOn() { return finReviewOn(V().settings); }
function iReview() { return !!S.me && finRevParts(S.me).length > 0; }
function toReview() { return V().requests.filter(function (r) { return r.status === 'Review' && finCanRev(S.me, r) && !(r.revLater && r.revLater > today()); }).sort(byPrio); }
/* education requests still with the Head of Department: the social reviewer sees them, read only */
function eduWait() { return finRevParts(S.me).indexOf('S') < 0 ? [] : V().requests.filter(function (r) { return r.status === 'Review' && r.stage === 'E' && finEdu(r.section); }).sort(byPrio); }
function eduNames() { return V().users.filter(function (x) { return x.active !== false && finRevParts(x).indexOf('E') >= 0; }).map(function (x) { return x.name; }); }
function notReviewed() { return V().requests.filter(function (r) { return r.status === 'Review'; }); }

/* ================= what is kept on this phone ================= */
var KV = (function () {
  var mem = {}, dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var rq = indexedDB.open('cyp-fin', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  return {
    get: function (k) { return open().then(function (db) { if (!db) return mem[k]; return new Promise(function (res) { try { var r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = function () { res(r.result); }; r.onerror = function () { res(mem[k]); }; } catch (e) { res(mem[k]); } }); }); },
    set: function (k, v) { mem[k] = v; return open().then(function (db) { if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} }); }
  };
})();

var S = { cfg: null, users: [], me: null, cred: '', cache: null, queue: [], verif: {}, online: true, syncing: false, lastSync: '', notices: [], thanks: '', local: null, files: {}, shared: null, demoCom: [], comName: '', picking: false,
  ui: { screen: 'boot', tab: '', form: {}, modal: null, m: {}, month: '', pick: null, err: '', msg: '' }, _v: null };
function emptyCache() { return { users: [], requests: [], deadlines: [], comments: [], settings: null, since: 0 }; }
function saveQueue() { KV.set('queue', S.queue); }
function saveCache() { if (S.me) KV.set('cache:' + S.me.id, S.cache); }
function myQueue() { return S.queue.filter(function (o) { return S.me && o.user === S.me.id; }); }

/* the database on this phone only (demo, or a first test without Google) */
var localStore = {
  key: function () { return 'local'; }, now: nowIso,
  load: function () { return S.local; },
  save: function (db) { S.local = db; KV.set('localdb', db); },
  saveFile: function (name, mime, b64) { var id = 'L' + uid(); S.files[id] = { mime: mime, b64: b64 }; KV.set('localfiles', S.files); return id; },
  getFile: function (id) { return S.files[id] || null; }
};
function call(req) {
  req.key = S.cfg.key;
  if (S.cfg.mode !== 'shared') { try { return Promise.resolve(clone(finHandle(req, localStore))); } catch (e) { return Promise.reject(e); } }
  return fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow' }).then(function (r) { return r.json(); });
}

/* ================= the picture on screen = what the database said + what is still waiting to be sent ================= */
function V() {
  if (S._v) return S._v;

};

/* a page drawn again between the press and the release of a tap loses the tap: wait until it ends */
var tapDown = false, tapWait = false;
function laterRender() { if (tapDown) tapWait = true; else render(); }
document.addEventListener('pointerdown', function () { tapDown = true; }, true);
document.addEventListener('pointerup', function () { tapDown = false; if (tapWait) { tapWait = false; setTimeout(render, 0); } }, true);
